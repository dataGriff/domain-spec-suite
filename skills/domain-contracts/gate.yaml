phase: contracts
description: |
  Phase 6. Hard gate. Lints the three contract files (Spectral on
  OpenAPI + AsyncAPI, datacontract-cli on the data contract) and
  cross-references them against every prior phase's outputs (domain
  model, auth matrix, error catalogue). No warnings, no rubric checks
  — every check is mechanical and must pass for sign-off.

# Files whose sha256 sign_off.py records in phase-6-passed.yaml on a
# successful gate run. Touched (or hand-edited) files trip
# SIGNOFF-SHA256-MATCHES at audit time, marking the phase stale.
signs_files:
  - docs/specifications/contracts/openapi.yaml
  - docs/specifications/contracts/asyncapi.yaml
  - docs/specifications/contracts/datacontract.yaml

# Reporting order: tool checks first (catch the cheap rule violations
# before the cross-reference checks waste time), then cross-references
# grouped by relationship area.
checks:
  # Tool lints
  - id: SPECTRAL-OPENAPI
  - id: SPECTRAL-ASYNCAPI
  - id: DATACONTRACT-LINT

  # Entity / schema alignment
  - id: ENTITY-IN-OPENAPI-SCHEMA
  - id: FIELD-MATCH-DOMAIN-OPENAPI
  - id: ENUM-VALUES-CONSISTENT

  # Event / data contract alignment
  - id: WRITE-OP-HAS-ASYNCAPI-CHANNEL
  - id: EVENT-IN-DATACONTRACT
  - id: EVENT-PAYLOAD-COVERS-ENTITY-STATE

  # Historic-record closure (gate 1.2)
  - id: EVENT-FK-RESOLVABLE
  - id: DATACONTRACT-REFS-RESOLVE

  # Consumer-facing SLAs (gate 1.4)
  - id: DATACONTRACT-SLA-COMPLETE

  # Access control / errors
  - id: AUTH-MATRIX-OPENAPI-MATCH
  - id: ERROR-CODE-IN-CATALOGUE
  - id: ERROR-CODE-REPRESENTABLE

  # Scenario traceability (gate 1.2)
  - id: OPERATION-HAS-SCENARIO
  - id: SCENARIO-REFS-VALID

  # Safe-retry semantics
  - id: IDEMPOTENCY-KEY-ON-POST-OPS
