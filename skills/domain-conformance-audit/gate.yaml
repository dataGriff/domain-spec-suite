phase: audit
description: |
  Phase 7. Re-runs every phase 1-6 cross-reference check at error
  severity, plus audit-only checks (placeholders, sign-off integrity,
  force-advance acceptance, ambiguity resolution, generator
  cleanliness). The gate that gives soft middle gates teeth.

# Listed in the order the runner reports them. Audit-only checks
# first (they're cheap and catch the most common breaks), then
# cross-phase re-runs grouped by relationship area.
checks:
  # Audit-only
  - id: NO-TEMPLATE-PLACEHOLDERS
  - id: SIGNOFF-SHA256-MATCHES
  - id: FORCE-ADVANCES-ALL-ACCEPTED
  - id: AMBIGUITIES-NO-AUDIT-REQUIRED

  # Tool lints (re-run from Phase 6 — defense in depth per BUILD-PLAN
  # 2.3). Each skips when its CLI isn't installed; a properly
  # bootstrapped domain repo pins them via .mise.toml.
  - id: SPECTRAL-OPENAPI
  - id: SPECTRAL-ASYNCAPI
  - id: DATACONTRACT-LINT

  # Entity / glossary / contract alignment
  - id: ENTITY-IN-GLOSSARY
  - id: GLOSSARY-COVERS-DOMAIN-TERMS
  - id: ENTITY-IN-OPENAPI-SCHEMA
  - id: FIELD-MATCH-DOMAIN-OPENAPI
  - id: ENUM-VALUES-CONSISTENT

  # Event / data contract alignment
  - id: WRITE-OP-HAS-ASYNCAPI-CHANNEL
  - id: EVENT-IN-DATACONTRACT
  - id: EVENT-PAYLOAD-COVERS-ENTITY-STATE

  # Historic-record closure (gate 1.2)
  - id: ENTITY-HAS-EVENT
  - id: EVENT-FK-RESOLVABLE
  - id: DATACONTRACT-REFS-RESOLVE

  # Access control / errors
  - id: AUTH-MATRIX-OPENAPI-MATCH
  - id: AUTH-ROLE-TRACES-TO-PERSONA
  - id: ERROR-CODE-IN-CATALOGUE
  - id: ERROR-CODE-REPRESENTABLE

  # Safe-retry semantics
  - id: IDEMPOTENCY-KEY-ON-POST-OPS

  # PRD <-> downstream alignment
  - id: PRD-STORY-PERSONA-LINK
  - id: STORY-HAS-FLOW
  - id: LIFECYCLE-IN-FLOWS
  - id: US-HAS-SCENARIO
  - id: OPERATION-HAS-SCENARIO
  - id: SCENARIO-REFS-VALID

  # Generator output (runs last — it's the heaviest)
  - id: GENERATOR-CLEAN-OUTPUT
