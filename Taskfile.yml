version: '3'

# Suite-internal Taskfile. These tasks run inside the domain-spec-suite
# repo itself (the build). They are distinct from the Taskfile the
# suite *installs* into a bootstrapped domain repo (which carries
# `task gate:<phase>`, `task audit`, etc.).

vars:
  PYTHON: '{{.PYTHON | default "python"}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  # ── Environment ──────────────────────────────────────────────────

  setup:
    desc: Install mise tooling and Python dev dependencies (run once after cloning)
    cmds:
      - mise install
      - "{{.PYTHON}} -m pip install -e .[dev]"

  # ── Quality ──────────────────────────────────────────────────────

  lint:
    desc: Ruff lint + format check across the suite's own Python + question-bank coverage
    cmds:
      - ruff check .
      - ruff format --check .
      - "{{.PYTHON}} scripts/check_questions_coverage.py"

  format:
    desc: Apply ruff formatting
    cmds:
      - ruff format .

  test:
    desc: Run the full pytest suite
    cmds:
      - pytest

  check:
    desc: 'Full pre-commit / pre-push / CI check: lint + tests. Single source of truth for "is the suite green?"'
    cmds:
      - task: lint
      - task: test

  hooks:install:
    desc: Wire .githooks/ into this clone (run once after cloning)
    cmds:
      - git config core.hooksPath .githooks
      - echo "Git hooks installed from .githooks/"

  test:bootstrap:
    desc: Tests for the bootstrap skill (stub — implemented in BUILD-PLAN Task 2.2)
    cmds:
      - pytest -m bootstrap

  test:audit:
    desc: Tests for the audit skill (pytest -m audit)
    cmds:
      - pytest -m audit

  test:discovery:
    desc: Tests for the discovery skill (pytest -m discovery)
    cmds:
      - pytest -m discovery

  test:orchestrator:
    desc: Tests for the orchestrator (pytest -m orchestrator)
    cmds:
      - pytest -m orchestrator

  audit:
    desc: 'Run the Phase 7 conformance audit against a target domain repo. Usage: task audit -- --repo /path/to/domain'
    cmds:
      - "{{.PYTHON}} shared/run_phase.py audit {{.CLI_ARGS}}"

  init:discovery:
    desc: 'Copy blank prd.md template into docs/specifications/ (only if absent — never overwrites). Usage: task init:discovery -- --repo /path/to/domain'
    cmds:
      - "{{.PYTHON}} scripts/init_phase.py discovery {{.CLI_ARGS}}"

  gate:discovery:
    desc: 'Run the Phase 1 discovery gate against a target domain repo. Usage: task gate:discovery -- --repo /path/to/domain'
    cmds:
      - "{{.PYTHON}} shared/run_phase.py discovery {{.CLI_ARGS}}"

  sign-off:discovery:
    desc: 'Run the discovery gate and, if it passes, write _phase-1-passed.yaml. Usage: task sign-off:discovery -- --repo /path/to/domain'
    cmds:
      - "{{.PYTHON}} shared/sign_off.py discovery {{.CLI_ARGS}}"

  init:modeling:
    desc: 'Copy domain-model + glossary templates into docs/specifications/. Usage: task init:modeling -- --repo /path/to/domain'
    cmds:
      - "{{.PYTHON}} scripts/init_phase.py modeling {{.CLI_ARGS}}"

  gate:modeling:
    desc: 'Run the Phase 2 modeling gate. Usage: task gate:modeling -- --repo /path/to/domain'
    cmds:
      - "{{.PYTHON}} shared/run_phase.py modeling {{.CLI_ARGS}}"

  sign-off:modeling:
    desc: 'Sign off Phase 2 (modeling). Usage: task sign-off:modeling -- --repo /path/to/domain --findings <yaml>'
    cmds:
      - "{{.PYTHON}} shared/sign_off.py modeling {{.CLI_ARGS}}"

  init:access-control:
    desc: 'Copy auth-matrix + error-catalogue templates. Usage: task init:access-control -- --repo /path/to/domain'
    cmds:
      - "{{.PYTHON}} scripts/init_phase.py access-control {{.CLI_ARGS}}"

  gate:access-control:
    desc: 'Run the Phase 3 access-control gate. Usage: task gate:access-control -- --repo /path/to/domain'
    cmds:
      - "{{.PYTHON}} shared/run_phase.py access-control {{.CLI_ARGS}}"

  sign-off:access-control:
    desc: 'Sign off Phase 3 (access-control). Usage: task sign-off:access-control -- --repo /path/to/domain --findings <yaml>'
    cmds:
      - "{{.PYTHON}} shared/sign_off.py access-control {{.CLI_ARGS}}"

  init:flows:
    desc: 'Copy sequence-diagrams template. Usage: task init:flows -- --repo /path/to/domain'
    cmds:
      - "{{.PYTHON}} scripts/init_phase.py flows {{.CLI_ARGS}}"

  gate:flows:
    desc: 'Run the Phase 4 flows gate. Usage: task gate:flows -- --repo /path/to/domain'
    cmds:
      - "{{.PYTHON}} shared/run_phase.py flows {{.CLI_ARGS}}"

  sign-off:flows:
    desc: 'Sign off Phase 4 (flows). Usage: task sign-off:flows -- --repo /path/to/domain --findings <yaml>'
    cmds:
      - "{{.PYTHON}} shared/sign_off.py flows {{.CLI_ARGS}}"

  init:nfrs:
    desc: 'Copy nfr + acceptance-scenarios templates. Usage: task init:nfrs -- --repo /path/to/domain'
    cmds:
      - "{{.PYTHON}} scripts/init_phase.py nfrs {{.CLI_ARGS}}"

  gate:nfrs:
    desc: 'Run the Phase 5 nfrs gate. Usage: task gate:nfrs -- --repo /path/to/domain'
    cmds:
      - "{{.PYTHON}} shared/run_phase.py nfrs {{.CLI_ARGS}}"

  sign-off:nfrs:
    desc: 'Sign off Phase 5 (nfrs). Usage: task sign-off:nfrs -- --repo /path/to/domain --findings <yaml>'
    cmds:
      - "{{.PYTHON}} shared/sign_off.py nfrs {{.CLI_ARGS}}"

  init:contracts:
    desc: 'Copy blank contract templates into docs/specifications/contracts/ (only if absent — never overwrites). Usage: task init:contracts -- --repo /path/to/domain'
    cmds:
      - "{{.PYTHON}} scripts/init_phase.py contracts {{.CLI_ARGS}}"

  gate:contracts:
    desc: 'Run the Phase 6 contracts gate against a target domain repo. Usage: task gate:contracts -- --repo /path/to/domain'
    cmds:
      - "{{.PYTHON}} shared/run_phase.py contracts {{.CLI_ARGS}}"

  sign-off:contracts:
    desc: 'Run the contracts gate and, if it passes, write _phase-6-passed.yaml. Usage: task sign-off:contracts -- --repo /path/to/domain'
    cmds:
      - "{{.PYTHON}} shared/sign_off.py contracts {{.CLI_ARGS}}"

  suite:status:
    desc: 'Report orchestrator-relevant state for a target domain repo. Usage: task suite:status -- --repo /path/to/domain [--json]'
    cmds:
      - "{{.PYTHON}} scripts/orchestrator_status.py {{.CLI_ARGS}}"

  review:
    desc: 'Run the qualitative domain-review against a target spec repo. Verifies audit is green, prints the file list + category checklist for the agent. Usage: task review -- --repo /path/to/spec'
    cmds:
      - "{{.PYTHON}} scripts/domain_review.py {{.CLI_ARGS}}"

  # ── Fixtures ─────────────────────────────────────────────────────

  fixtures:reset:
    desc: Reset tests/fixtures/ to the committed state (discards local edits and untracked files under it)
    cmds:
      - git checkout -- tests/fixtures/
      - git clean -fdq tests/fixtures/

  fixtures:seed-signoffs:
    desc: Regenerate sha256s in every tests/fixtures/*/docs/specifications/_phase-*-passed.yaml against current file contents
    cmds:
      - "{{.PYTHON}} scripts/seed_signoffs.py"

  # ── Suite operator commands (wrappers around scripts/) ──────────
  # These act on a target domain repo (current working directory by
  # default, or --repo <path>). Most are stubs until the relevant
  # implementation milestone.

  suite:force-advance:
    desc: 'Record a force-advance entry in a target repo. Usage: task suite:force-advance -- <phase> --reason "<text>" --repo /path'
    cmds:
      - "{{.PYTHON}} scripts/force_advance.py {{.CLI_ARGS}}"

  suite:accept-force:
    desc: 'Mark the most recent unaccepted force-advance entry as accepted. Usage: task suite:accept-force -- <phase> --reason "<text>" --repo /path'
    cmds:
      - "{{.PYTHON}} scripts/accept_force.py {{.CLI_ARGS}}"

  suite:bootstrap:
    desc: 'Lay down the canonical domain repo shell in a target directory. Usage: task suite:bootstrap -- --target /path --domain-name "Items" [--force]'
    cmds:
      - "{{.PYTHON}} scripts/bootstrap.py {{.CLI_ARGS}}"

  suite:regenerate-manifest:
    desc: Rebuild skills/domain-bootstrap/template_manifest.yaml from the current templates/ directory
    cmds:
      - "{{.PYTHON}} scripts/regenerate_manifest.py"

  suite:upgrade-shell:
    desc: 'Manifest-aware re-bootstrap that preserves spec content. Overwrites only template_manifest.yaml-listed files; recovers the domain name from .spec-suite/bootstrap.yaml. Usage: task suite:upgrade-shell -- --repo /path'
    cmds:
      - "{{.PYTHON}} scripts/upgrade_shell.py {{.CLI_ARGS}}"

  suite:reset-phase:
    desc: 'Dev-only: delete a phase''s sign-off sidecar + signed outputs and mark it not-started. Dry-run by default; add --yes to apply. Usage: task suite:reset-phase -- <phase> --repo /path [--yes]'
    cmds:
      - "{{.PYTHON}} scripts/reset_phase.py {{.CLI_ARGS}}"
